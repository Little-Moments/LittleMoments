services:
  littlemoments:
    image: littlemoments
    build:
      context: .
      dockerfile: LittleMoments/Dockerfile
    depends_on:
      - db
  db: 
    image: postgres:latest 
    environment: 
      POSTGRES_USER: myuser 
      POSTGRES_PASSWORD: mypassword 
      POSTGRES_DB: mydatabase 
      ports: 
        - "5432:5432"
      volumes: 
        - db-data:/var/lib/postgresql/data
  
  pgadmin:
    

volumes:
  db-data: